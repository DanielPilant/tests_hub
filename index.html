<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בחינות עצמיות</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1c2230;
  --muted: #5a6373;
  --border: #d8dde6;
  --border-strong: #b9c1ce;
  --accent: #2456c4;
  --accent-weak: #eaf0fc;
  --code-bg: #f3f5f8;
  --ok: #1b6e40;
  --bad: #a52a1f;
  --radius: 10px;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "Courier New", monospace;
  --sans: system-ui, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 17px; line-height: 1.65;
  overflow-x: hidden;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
header.site { border-bottom: 1px solid var(--border); background: var(--surface); }
header.site .wrap { padding-top: 12px; padding-bottom: 12px; }
header.site .bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
header.site h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
header.site .current { font-size: .95rem; color: var(--muted); }
header.site .current strong { color: var(--text); font-weight: 600; }
.notice {
  margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--border-strong);
  border-radius: 8px; background: #fffbea; font-size: .92rem;
}
h2 { font-size: 1.25rem; margin: 0 0 .5em; line-height: 1.4; }
h3 { font-size: 1.05rem; margin: 1.2em 0 .4em; }
h4 { font-size: .98rem; margin: 1em 0 .3em; }
p { margin: .5em 0; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin: 16px 0;
}
.muted { color: var(--muted); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
button, .btn {
  font: inherit; font-size: .95rem; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 8px 16px; min-height: 40px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: #1d47a6; }
button:disabled { opacity: .5; cursor: not-allowed; }
button[aria-pressed="true"] { background: var(--accent-weak); border-color: var(--accent); }
button.small { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h2[tabindex="-1"]:focus, h3[tabindex="-1"]:focus, main:focus { outline: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }
ul.facts { padding-inline-start: 1.2em; margin: .4em 0; }
ul.facts li { margin: .2em 0; }

/* Quiz chooser */
.quiz-cards { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .quiz-cards { grid-template-columns: 1fr; } }
.quiz-card { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.quiz-card h3 { margin: 0; font-size: 1.1rem; }
.quiz-card .status-lines { font-size: .92rem; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.quiz-card .row { margin-top: auto; padding-top: 8px; }

/* Mode picker */
.modes { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin: 10px 0 16px; border: 0; padding: 0; }
.modes legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
@media (max-width: 560px) { .modes { grid-template-columns: 1fr; } }
.modes label, .opt {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; background: var(--surface); cursor: pointer;
}
.modes label:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
.modes label:has(input:focus-visible), .opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="radio"] { width: 18px; height: 18px; margin: 4px 0 0; flex: none; accent-color: var(--accent); }

/* Status & navigation */
.status { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .92rem; color: var(--muted); margin-bottom: 10px; }
.badge {
  display: inline-block; font-size: .82rem; font-weight: 600; padding: 2px 10px;
  border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-weak);
}
.qnav { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin: 8px 0 4px; }
@media (max-width: 560px) { .qnav { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.qnav button {
  position: relative; padding: 4px 0; min-height: 38px; font-variant-numeric: tabular-nums;
  font-size: .9rem; border-radius: 6px;
}
.qnav button.answered { background: var(--accent-weak); border-color: var(--accent); font-weight: 600; }
.qnav button.answered::before { content: "●"; font-size: .55rem; position: absolute; top: 2px; right: 4px; color: var(--accent); }
.qnav button.flagged::after { content: "⚑"; font-size: .7rem; position: absolute; top: 1px; left: 4px; }
.qnav button[aria-current="step"] { outline: 2px solid var(--text); outline-offset: 1px; }
.qnav .mk { font-size: .75rem; margin-inline-start: 2px; }
.legend-line { font-size: .82rem; color: var(--muted); }

/* Question */
.qhead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.qhead .qnum { font-weight: 700; }
.qhead .qtitle { font-weight: 500; color: var(--muted); font-size: 1rem; }
.qtext { font-size: 1.05rem; margin: 10px 0 14px; }
.context {
  margin: 12px 0; padding: 10px 14px; border: 1px solid var(--border);
  border-inline-start: 4px solid var(--accent); border-radius: 8px; background: #fafbfd;
}
.context .ctx-label { display: block; font-size: .82rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.context p { margin: 0; }
figure.code, figure.dtable { margin: 12px 0; }
figure.code figcaption, figure.dtable figcaption {
  font-size: .85rem; color: var(--muted); margin-bottom: 4px;
  display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center;
}
.lang {
  font-size: .75rem; font-weight: 600; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text); background: var(--surface);
  direction: ltr; unicode-bidi: isolate;
}
pre.code {
  direction: ltr; text-align: left; unicode-bidi: isolate;
  font-family: var(--mono); font-size: .9rem; line-height: 1.55;
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; margin: 0; overflow-x: auto; white-space: pre; tab-size: 4;
}
pre.code code { font-family: inherit; }
.ic {
  font-family: var(--mono); font-size: .9em; background: var(--code-bg);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
  display: inline-block; max-width: 100%; overflow-x: auto; white-space: pre;
  vertical-align: bottom; line-height: 1.5; unicode-bidi: isolate; direction: ltr;
}
.ltr { unicode-bidi: isolate; direction: ltr; }
.nobr { white-space: nowrap; }
table.data[dir="ltr"] th, table.data[dir="ltr"] td { text-align: left; }
fieldset.options { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.options legend { padding: 0; }
.opt { margin: 8px 0; min-width: 0; }
.opt:hover { border-color: var(--border-strong); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.locked { cursor: default; }
.opt .letter { font-weight: 700; font-family: var(--mono); min-width: 1.2em; direction: ltr; }
.opt .body { flex: 1; min-width: 0; }
.opt pre.code { padding: 6px 10px; background: transparent; border: 0; }
.opt .whole { display: block; direction: ltr; text-align: left; font-family: var(--mono); font-size: .92rem; overflow-x: auto; white-space: normal; padding: 2px 0; }
.opt .whole .seg { white-space: pre; }
.opt .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.tag.ok { color: var(--ok); }
.tag.bad { color: var(--bad); }
.opt.is-correct { border-color: var(--ok); border-width: 2px; }
.opt.is-wrong { border-color: var(--bad); border-style: dashed; border-width: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 18px; }
.controls .group { display: flex; flex-wrap: wrap; gap: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.hint { border-inline-start: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-weak); border-radius: 6px; margin-top: 10px; }

/* Solutions */
.solution { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.verdict.none { color: var(--muted); }
.solution ol, .solution ul { padding-inline-start: 1.4em; margin: .3em 0; }
.solution li { margin: .2em 0; }
dl.feedback { margin: .3em 0; }
dl.feedback dt { font-weight: 600; margin-top: .5em; }
dl.feedback dd { margin: 0 0 .2em; padding-inline-start: 1.2em; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: start; vertical-align: top; }
th { background: var(--code-bg); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data td { font-family: var(--mono); font-size: .88rem; }
table.data td:lang(he), table.data td.he { font-family: var(--sans); font-size: .92rem; }

/* Results */
.score { font-size: 2.2rem; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
.score small { font-size: 1rem; font-weight: 500; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 8px 0; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.jump a { color: var(--accent); font-size: .9rem; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; background: var(--surface); }
.jump a:hover { border-color: var(--accent); }
.review-item h3 { margin-top: 0; }
.history { list-style: none; padding: 0; margin: 0; }
.history li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.history li:last-child { border-bottom: 0; }

dialog { border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 20px; max-width: min(480px, calc(100vw - 32px)); color: var(--text); }
dialog::backdrop { background: rgba(20, 25, 35, .35); }
dialog h2 { font-size: 1.1rem; }
</style>
</head>

ail')","limits":"הרצות בודקות דוגמאות ומקרי קצה; טענה על כל קלט דורשת גם נימוק מתמטי בהסבר."}},{"id":"Q15","title":"תכנון אינווריאנט לצובר","type":"single_choice","topics":["reduce","filter","accumulator_invariant"],"difficulty":"advanced","points":5,"source_slides":[54,57,59,61,63],"learning_objective":"לבנות צובר מורכב ולהוכיח את משמעותו לכל קידומת של הקלט.","instructions_to_claude":{"layout":"שאלה אחת במסך; נוסח בעברית RTL וקוד Python ב-LTR.","specific_presentation":"הצג את הגדרת האינווריאנט בנוסח השאלה. הצג כל אפשרות כבלוק Python קצר.","options_layout":"ארבע אפשרויות אנכיות עם radio; אפשרות אחת בלבד.","preserve":"שמור בדיוק על ההזחות, הסוגריים, שמות המשתנים וההנחות. אין להוסיף פלט צפוי ליד קוד השאלה.","answer_visibility":"במצב בחינה הצג פתרונות רק לאחר הגשה סופית. במצב תרגול הצג פתרון לאחר בדיקת תשובה מפורשת.","review":"פתור עצמאית, הרץ את קוד האימות בסביבת Python מקומית ובדוק את כל המסיחים. שפר עמימות או טעות אם נמצאה, בלי להקל את השאלה; עדכן פתרון, הסברים ואימות יחד."},"question":"xs היא רשימת שלמים. רוצים ש-stats תחזיר (סכום, כמות) של כל האיברים האי־שליליים, כולל אפס. אם אין כאלה, תחזיר (0, 0). איזו הגדרה של step מבטיחה זאת עבור כל xs? אחרי עיבוד k איברים שעברו סינון, רכיב הכמות צריך להיות k.","code_blocks":[{"id":"main","label":"קוד השאלה","language":"python","code":"from functools import reduce\ndef stats(xs, step):\n    return reduce(step, filter(lambda x: x \u003e= 0, xs), (0, 0))"}],"options":[{"id":"A","text":"","code":"lambda acc, x: (acc[0] + x, acc[1] + x)","code_language":"python"},{"id":"B","text":"","code":"lambda acc, x: (acc[0] + x, acc[1] + bool(x))","code_language":"python"},{"id":"C","text":"","code":"lambda acc, x: (acc[0] + x, acc[1] + 1)","code_language":"python"},{"id":"D","text":"","code":"lambda acc, x: (acc[0] + acc[1], acc[1] + 1)","code_language":"python"}],"hint":"בדוק רשימה שמכילה אפס ומספר חיובי שונה מ-1.","answer":{"correct_option_id":"C","explanation":"הצובר ההתחלתי (0,0) נכון לקידומת הריקה. אם לפני צעד הרכיבים הם סכום וכמות של ת.","review":"פתור עצמאית, הרץ את קוד האימות בסביבת Python מקומית ובדוק את כל המסיחים. שפר עמימות או טעות אם נמצאה, בלי להקל את השאלה; עדכן פתרון, הסברים ואימות יחד."},"question":"מהו result? הרשומות הן (שם, ציון מקורי). make_rule בונה כלל סינון, ושינוי הציון מתבצע רק אחריו. יש לכלול בסכום הסופי רק ציונים מעודכנים שהם לפחות 90.","code_blocks":[{"id":"main","label":"קוד השאלה","language":"python","code":"from functools import reduce\n\ndef make_rule(low, high):\n    return lambda row: low \u003c= row[1] \u003c high\n\nrows = [(\"Noa\", 80), (\"Avi\", 90), (\"Dana\", 75),\n        (\"Eli\", 95), (\"Maya\", 85)]\nselected = filter(make_rule(80, 95), rows)\nupdated = map(lambda row: (row[0], row[1] + 5), selected)\nordered = sorted(updated, key=lambda row: (-row[1], row[0]))\n\nresult = reduce(\n    lambda acc, row: (acc[0] + (row[0],), acc[1] + row[1]),\n    filter(lambda row: row[1] \u003e= 90, ordered),\n    ((), 0)\n)"}],"options":[{"id":"A","text":"((\"Avi\", \"Maya\"), 185)","code":null,"code_language":null},{"id":"B","text":"((\"Maya\", \"Avi\"), 185)","code":null,"code_language":null},{"id":"C","text":"((\"Eli\", \"Avi\", \"Maya\"), 285)","code":null,"code_language":null},{"id":"D","text":"((\"Avi\", \"Maya\", \"Noa\"), 270)","code":null,"code_language":null}],"hint":"רשום ליד כל שלב איזה מבנה נתונים עובר בו והאם הציון כבר עודכן.","answer":{"correct_option_id":"A","explanation":"הסינון הראשון בודק את הציונים המקוריים בטווח 80 כולל עד 95 לא כולל, ולכן Noa, Avi ו-Maya עוברות. אחרי התוספת הציונים הם 85, 95 ו-90. המיון מציב את Avi לפני Maya ולפני Noa, והסינון השני מסיר את Noa. reduce צוברת tuple של שמות וסכום 185.","reasoning_steps":["הטווח הראשון אינו כולל את הציון 95 של Eli.","לאחר המיפוי מתקבלות (Noa,85), (Avi,95), (Maya,90).","המפתח השלילי ממיין ציונים בסדר יורד.","אחרי סף 90 נשארות Avi ו-Maya; 95+90=185."],"option_feedback":{"A":"האפשרות משמרת את שני הסינונים, סדר המיון ומבנה הצובר.","B":"הסכום נכון אך סדר השמות אינו תואם למפתח המיון.","C":"Eli נפסל בסינון הראש ביט לאיבר. Padding בין שדות אינו bit compaction. PL04 מציגה מודל פריסה מחייב."},{"pdf_pages":[16,17,18],"note":"reference של C++ אינה חייבת להיות ממומשת כמצביע פיזי בכל הקשר. אל תקבע מספר הוראות מכונה קבוע; בדוק את הסמנטיקה של aliasing והקישור הראשוני."},{"pdf_pages":[19,20],"note":"גישה לאובייקט שחייו הסתיימו אינה נעשית תקפה משום שעדיין לא נעשה שימוש חוזר בזיכרונו. GC גם אינו מבטל כל סוג אפשרי של דליפת זיכרון לוגית."},{"pdf_pages":[21,22,23],"note":"null אינו מבטיח זריקת חריגה ב-C++: נדרש מנגנון בדיקה מפורש לפני dereference. PL07 מגדירה אותו. להגרלה אחידה של b ביטים, סיכוי התאמה למפתח ישן קבוע בהגרלה אחת הוא 1/2^b, לא 2^b."},{"pdf_pages":[24,25],"note":"weak_ptr אינה raw dangling pointer ואינה מגדילה את מספר הבעלים החזקים. lock מספקת shared_ptr אם האובייקט עדיין חי, או shared_ptr ריק לאחר פקיעתו. לא צריך להפוך כל קשת במבנה ל-weak; יש לתכנן בעלות ולשבור מעגלים בהתאם."},{"pdf_pages":[26],"note":"std::move אינה העברה בפני עצמה. אין הבטחה שכל אובייקט שממנו בוצעה העברה נהיה ריק; ב-PL09 נבחנת ההבטחה הספציפית של unique_ptr."},{"pdf_pages":[28,29,31,32],"note":"static scope מתאר את כלל בחירת הקישור; הגישה בפועל לרשומת הפעלה מתרחשת בזמן ריצה. deep/shallow access כאן הם מימושים של אותה סמנטיקה דינמית, לא deep/shallow binding של העברת פונקציות."},{"pdf_pages":[33,34,35,36,37,38],"note":"שורשי GC אינם בהכרח המחסנית בלבד; הם יכולים לכלול גם גלובליים ורגיסטרים. בשאלות ניתנת קבוצת שורשים מלאה. reference counting היא טכניקת ניהול/איסוף זיכרון; אין להציג את הביטוי GC ככינוי בלעדי ל-tracing. אין להעתיק טענות גורפות על אלגוריתם GC יחיד לכל Python, JVM או CLR."},{"pdf_pages":[37,38],"note":"Cheney מעתיקה אובייקטים חיים ומעדכנת הפניות; forwarding אינו הופך עותק חדש לכל alias. שתי האצבעות הן scan ו-free. שיתוף ומחזורים אינם סיבה להעתקה חוזרת."},{"pdf_pages":[39,40,41],"note":"C# out הוא פרמטר בהפניה עם כללי definite assignment, ואינו הבטחה למנגנון copy-out. PL15–PL16 משתמשות במודלים מופשטים מפורשים, ולא טוענות שכך C# מממשת out."},{"pdf_pages":[43,44,45,46],"note":"יש להפריד x86 מ-x64 ולהגדיר ABI. cdecl ו-stdcall ב-Microsoft x86 מעבירות ארגומנטים מימין לשמאל; ההבדל המרכזי כאן הוא ניקוי המחסנית. כלל סדר העברה אינו כלל סדר הערכה בשפת המקור."},{"pdf_pages":[48,49,50,51,52],"note":"שם זהה אינו מבטיח override. חתימה שונה יכולה להשאיר מחלקה מופשטת. vtable היא אסטרטגיית מימוש נפוצה, לא תבנית פריסה שהתקן מחייב לכל מחלקה; pure virtual אינה מחייבת תא null בפועל. ירושה וירטואלית ושיגור וירטואלי הם נושאים שונים."}]},"reference_documentation":[{"title":"Microsoft x86 argument passing and calling conventions","url":"https://learn.microsoft.com/en-us/cpp/cpp/argument-passing-and-naming-conventions?view=msvc-170"},{"title":"Microsoft __fastcall","url":"https://learn.microsoft.com/en-us/cpp/cpp/fastcall?view=msvc-170"},{"title":"C++ draft: user-defined conversions","url":"https://eel.is/c++draft/class.conv"},{"title":"C++ draft: virtual functions","url":"https://eel.is/c++draft/class.virtual"},{"title":"C++ draft: initialization of bases and members","url":"https://eel.is/c++draft/class.base.init"},{"title":"C++ draft: weak_ptr","url":"https://eel.is/c++draft/util.smartptr.weak"},{"title":"C# method parameters and out semantics","url":"https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/method-parameters"}],"questions":[{"id":"PL01","title":"ניידות וסדר הערכה","type":"single_choice","difficulty":"advanced","points":5,"topics":["language_evaluation","portability","evaluation_order"],"learning_objective":"להבחין בין ניידות תוכנית לבין הבטחת תוצאה יחידה כשסדר הערכה לא נקבע.","source_pages":{"pdf":[4,5],"printed":[3,4]},"semantic_context":"שפת פסאודו L מתורגמת לקוד ביניים שרץ על מכונה וירטואלית. הוראת הקריאה בקוד הביניים שומרת את ביטויי הארגומנטים, והגדרת ה-VM מתירה למנוע לחשב אותם בכל אחד משני הסדרים: בזה אחר זה, ללא שזירה. f מקבלת תמיד את תוצאת g בארגומנט הראשון ואת תוצאת h בשני.","instructions_to_claude":{"layout":"שאלה אחת בכל פעם; עברית RTL וקוד, נוסחאות וכתובות LTR.","specific_presentation":"הצג את כללי שפת L מעל הקוד. אל תתייג את הפסאודו־ ל־ימין; VM אינה מכתיבה כאן סדר.","C":"שתי התוצאות עומדות במודל המוגדר, בלי סתירה לניידות.","D":"שונות שמותרת בהגדרת השפה אינה הוכחה למימוש שגוי."}},"author_validation":{"visibility":"author_only","kind":"python_model_and_reasoning","python_assertions":"results=set()\nfor order in [('g','h'),('h','g')]:\n    x=1; vals={}\n    for name in order:\n        x=x+1 if name=='g' else 2*x\n        vals[name]=x\n    results.add((vals['g']+vals['h'],x))\nassert results=={(6,4),(5,3)}","cpp_cases":[],"instructions":"בדיקות Python כאן הן עצמיות: אין להריץ לפניהן את code_blocks. מקרי C++ הם יחידות תרגום נפרדות. קמפל עם g++ -std=c++17 -Wall -Wextra -pedantic-errors. כישלון צפוי בקימפול הוא תוצאה תקינה של הבדיקה. אין להריץ קוד שנכשל בקימפול, קוד עם התנהגות לא מוגדרת, או קוד מתוך JSON בדפדפן.","limits":"סימולציה בודקת את המודל המפורש שבשאלה. פלט של קומפיילר יחיד אינו מוכיח הבטחה של התקן או התנהגות בכל ABI. נימוק התשובה הוא חלק מהאימות."}},{"id":"PL02","title":"הסקת טיפוסים ו-Duck Typing","type":"single_choice","difficulty":"advanced","points":5,"topics":["type_inference","static_typing","dynamic_typing","duck_typing"],"learning_objective":"להפריד בין היעדר הצהרת טיפוס, זמן בדיקת טיפוסים והתאמה לפי פעולות נתמכות.","source_pages":{"pdf":[6,7,8,9],"printed":[5,6,7,8]},"semantic_context":"שפה S מסיקה טיפוס פעם אחת מן האתחול בזמן קימפול ואוסרת שינוי טיפוס של משתנה. קטע Python נבחן לפי Python 3.13; אין קשר ירושה בין המחלקות.","instructions_to_claude":{"layout":"שאלה אחת בכל פעם; עברית RTL וקוד, נוסחאות וכתובות LTR.","specific_presentation":"הצג שני בלוקי קוד נפרדים עם תוויות שפה; אל תאחד אותם לתוכנית אחת.","preserve":"הצג את כל הנחות question ו-semantic_context. שמור על סדר הפעולות, גבולות הבלוקים והזחות הקוד.","options":"ארבע אפשרויות אנכיות עם radio; בחירה אחת בלבד.","review":"פתור עצמאית ובדוק כל מסיח. תקן טעות או עמימות בלי להוריד קושי ובלי לשנות הנחות בשקט; עדכן מפתח, הסברים ואימות יחד.","solutions":"בבחינה חשוף תשובה והסברים רק אחרי הגשה. בתרגול רק לאחר בדיקת תשובה מפורשת. מטא־נתוני ת A ו-w פגה.","reasoning_steps":["ב-P מספר האובייקטים הוא 2, ומספר הבעלים של A הוא 1.","אחרי lock, A מוחזקת על ידי B.next וגם hold.","שחרור B גורם לשחרור הקשת שלו אל A.","ב-Q נשאר אובייקט אחד עם בעלים אחד; ב-R לא נשאר בעלים של A."],"option_feedback":{"A":"הקשתות החזקות במעגל ממשיכות להחזיק את האובייקטים אחרי איפוס המשתנים המקומיים.","B":"weak_ptr אינה נספרת ב-use_count, ו-hold הוא הבעלים האחרון אחרי השבירה.","C":"המעקב כולל את תוספת הבעלות של lock ואת הסרתה בסוף.","D":"איפוס קשת חזקה יכול להוריד מונה לאפס ולהתחיל שרשרת הרס."}},"author_validation":{"visibility":"author_only","kind":"cpp17_and_reasoning","python_assertions":null,"cpp_cases":[{"label":"runtime_assertions","standard":"c++17","source":"#include \u003ccassert\u003e\n#include \u003ccstddef\u003e\n#include \u003ciostream\u003e\n#include \u003cmemory\u003e\n#include \u003cstdexcept\u003e\n#include \u003ctuple\u003e\n#include \u003ctype_traits\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\nstruct Node {\n    static int alive;\n    std::shared_ptr\u003cNode\u003e next;\n    Node() { ++alive; }\n    ~Node() { --alive; }\n};\nint Node::alive = 0;\n\nint main(){\n\nauto a = std::make_shared\u003cNode\u003e();\nauto b = std::make_shared\u003cNode\u003e();\na-\u003enext = b;\nb-\u003enext = a;\nstd::weak_ptr\u003cNode\u003e w = a;\na.reset();\nb.reset();\nconst int alive_P = Node::alive;\nconst long owners_P = w.use_count();\n\nauto hold = w.lock();\nhold-\u003enext.reset();\nconst int alive_Q = Node::alive;\nconst long owners_Q = w.use_count();\n\nhold.reset();\nconst bool expired_R = w.expired();\n\n    assert(alive_P==2 \u0026\u0026 owners_P==1 \u0026\u0026 alive_Q==1 \u0026\u0026 owners_Q==1 \u0026\u0026 expired_R);\n    assert(Node::alive==0);\n    }\n","expect_compile":true,"run_if_compiled":true,"expected_exit_code":0}],"instructions":"בדיקות Python כאן הן עצמיות: אין להריץ לפניהן את code_blocks. מקרי C++ הם יחידות תרגום נפרדות. קמפל עם g++ -std=c++17 -Wall -Wextra -pedantic-errors. כישלון עדים לעורך בלבד."},"question":"מהו רצף הערכים שמודפס ב-static scope ומהו הרצף ב-dynamic scope? כיצד החלפת deep access ב-shallow access תקינה משפיעה על הרצף הדינמי?","code_blocks":[{"id":"קוד השאלה","label":"קוד השאלה","language":"pseudocode","code":"procedure A():\n    var x := 1\n    procedure B():\n        procedure D():\n            x := x + 2\n            emit(x)\n        D()\n    procedure C():\n        var x := 10\n        B()\n        emit(x)\n    C()\n    emit(x)\nA()"}],"data_tables":[],"options":[{"id":"A","text":"סטטי: (3, 10, 3); דינמי: (12, 12, 1); החלפת מנגנון הגישה אינה משנה את הרצף הדינמי.","code":null,"code_language":null},{"id":"B","text":"סטטי: (12, 12, 1); דינמי: (3, 10, 3); החלפת מנגנון הגישה אינה משנה את הרצף הדינמי.","code":null,"code_language":null},{"id":"C","text":"סטטי: (3, 10, 3); דינמי עם deep: (12, 12, 1), אך עם shallow: (3, 10, 3).","code":null,"code_language":null},{"id":"D","text":"סטטי: (3, 10, 1); דינמי: (12, 10, 1); השמה לשם לא־מקומי תמיד יוצרת עותק מקומי.","code":null,"code_language":null}],"hint":"צייר לעצמך בנפרד את עץ ההגדרות ואת רצף הקריאות A,C,B,D.","answer":{"correct_option_id":"A","explanation":"ב-static scope, D מחפשת בהורים הלקסיקליים B ואז A, ולכן משנה את A.x ל-3. C.x נשאר 10. ב-dynamic scope שרשרת הקריאות היא A,C,B,D, ולכן D מוצאת ומשנה את C.x ל-12. A.x נשאר 1. שתי שיטות הגישה הדינמיות חייבות לשמר אותה בחירת קישור.","reasoning_steps":["קינון של הגדרות וסדר קריאות הם שני מבנים שונים.","בכל מודל ההשמה והקריאה מתייחסות לאותו x שנבחר.","shallow access שומרת קישורים פעילים לפי שם; היא אינה הופכת scope דינמי ללקסיקלי."],"option_feedback":{"A":"הרצפים נובעים משתי סביבות שונות עבור x בתוך D.","B":"שני המודלים הוחלפו.","C":"שינוי מבנה הנתונים של הגישה אינו אמור לשנות את כללי ה-scope.","D":"המודל קובע השמה לקישור שנמצא, ולא יצירת משתנה מקומי חדש."}},"author_validation":{"visibility":"author_only","kind":"python_model_and_reasoning","python_assertions":"def run(mode):\n    frames={'A':{'x':1},'C':{'x':10},'B':{},'D':{}}\n    static_parent={'D':'B','B':'A','C':'A','A':None}\n    dynamic_parent={'D':'B','B':'C','C':'A','A':None}\n    chain=static_parent if mode=='static' else dynamic_parent\n    f='D'\n    while 'x' not in frames[f]: f=chain[f]\n    frames[f]['x']+=2\n    return (frames[f]['x'],frames['C']['x'],frames['A']['x'])\nassert run('static')==(3,10,3)\nassert run('dynamic')==(12,12,1)\n# Shallow access: topmost active binding for x is C.x.\nstack=[{'frame':'A','x':1},{'frame':'C','x':10}]\nstack[-1]['x']+=2\nassert (stack[-1]['x'],stack[-1]['x'],stack[0]['x'])==(12,12,1)","cpp_cases":[],"instructions":"בדיקות Python כאן הן עצמיות: אין להריץ לפניהן את code_blocks. מקרי C++ הם יחידות תרגום נפרדות. קמפל עם g++ -std=c++17 -Wall -Wextra -pedantic-errors. כישלון צפוי בקימפול הוא תוצאה תקינה של הבדיקה. אין להריץ קוד שנכשל בקימפול, קוד עם התנהגות לא מוגדרת, או קוד מתוך JSON בדפדפן.","limits":"סימולציה בודקת את המודל המפורש שבשאלה. פלט של קומפיילר יחיד אינו מוכיח הבטחה של התקן או התנהגות בכל ABI. נימוק התשובה הוא חלק מהאימות."}},{"id":"PL11","title":"קישורי הפעלה בזמן רקורסיה","type":"single_choice","difficulty":"advanced","points":5,"topics":["static_link","dynamic_link","activation_records","recursion"],"learning_objective":"לזהות הורה לקסיקלי לעומת קורא בזמן ריצה ולחשב מספר קפיצות שאינו תלוי בעומק הרקורסיה.","source_pages":{"pdf":[28,29,30,41],"printed":[27,28,29,40]},"semantic_context":"מודל רשומות הפעלה עם static link אל ההפעלה של ההורה הלקסיקלי ו-dynamic link אל הקורא. A בעומק 1; B ו-C מוגדרות בתוך A בעומק 2; D מוגדרת בתוך B בעומק 3. כל ההפעלות המתוארות עדיין פעילות.","instructions_to_claude":{"layout":"שאלה אחת בכל פעם; עברית RTL וקוד, נוסחאות וכתובות LTR.","specific_presentation":"הצג את הטבלה ואת רצף הקריאות. אין להוסיף מראש חצי static link פתורים בין הרשומות.","preserve":"הצג את כל הנחות question ו-semantic_context. שמור על סדר הפעולות, גבולות הבלוקים והזחות הקוד.","options":"ארבע אפשרויות אנכיות עם radio; בחירה אחת בלבד.","review":"פתור עצמאית ובדוק כל מסיח. תקן טעות או עמימות בלי \u003e\n#include \u003ccstddef\u003e\n#include \u003ciostream\u003e\n#include \u003cmemory\u003e\n#include \u003cstdexcept\u003e\n#include \u003ctuple\u003e\n#include \u003ctype_traits\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\nstruct B { virtual int f(int)=0; };\nstruct D:B { int f(double) override {return 1;} };\nint main(){}\n","expect_compile":false,"run_if_compiled":false,"expected_exit_code":null}],"instructions":"בדיקות Python כאן הן עצמיות: אין להריץ לפניהן את code_blocks. מקרי C++ הם יחידות תרגום נפרדות. קמפל עם g++ -std=c++17 -Wall -Wextra -pedantic-errors. כישלון צפוי בקימפול הוא תוצאה תקינה של הבדיקה. אין להריץ קוד שנכשל בקימפול, קוד עם התנהגות לא מוגדרת, או קוד מתוך JSON בדפדפן.","limits":"סימולציה בודקת את המודל המפורש שבשאלה. פלט של קומפיילר יחיד אינו מוכיח הבטחה של התקן או התנהגות בכל ABI. נימוק התשובה הוא חלק מהאימות."}},{"id":"PL20","title":"ירושת יהלום ובסיס וירטואלי","type":"single_choice","difficulty":"advanced","points":5,"topics":["multiple_inheritance","virtual_inheritance","constructors","shared_base_subobject"],"learning_objective":"לנתח שיתוף תת־אובייקט בסיס ואתחולו על ידי המחלקה הנגזרת ביותר.","source_pages":{"pdf":[48,50],"printed":[47,49]},"semantic_context":"C++17. virtual מופיעה בירושה של L ושל R מ-B, ולא בהכרזת פונקציה. B היא בסיס וירטואלי משותף. ב-D0 הבנאי נוצר אוטומטית ואין אתחול מפורש ל-B.","instructions_to_claude":{"layout":"שאלה אחת בכל פעם; עברית RTL וקוד, נוסחאות וכתובות LTR.","specific_presentation":"הצג את שני האובייקטים object ו-other ואת שתי הגדרות D ו-D0. אין לבלבל virtual inheritance עם virtual dispatch.","preserve":"הצג את כל הנחות question ו-semantic_context. שמור על סדר הפעולות, גבולות הבלוקים והזחות הקוד.","options":"ארבע אפשרויות אנכיות עם radio; בחירה אחת בלבד.","review":"פתור עצמאית ובדוק כל מסיח. תקן טעות או עמימות בלי להוריד קושי ובלי לשנות הנחות בשקט; עדכן מפתח, הסברים ואימות יחד.","solutions":"בבחינה חשוף תשובה והסברים רק אחרי הגשה. בתרגול רק לאחר בדיקת תשובה מפורשת. מטא־נתונים וקוד אימות מיועדים לעורך בלבד."},"question":"מהו הזוג־המורחב (first, second, third)? יש להתחשב גם בבסיס המשותף וגם בבנאי שנבחר לאתחל אותו.","code_blocks":[{"id":"קוד השאלה","label":"קוד השאלה","language":"cpp","code":"struct B {\n    int value;\n    B(int n = 0) : value(n) {}\n};\nstruct L : virtual B { L() : B(1) {} };\nstruct R : virtual B { R() : B(2) {} };\nstruct D : L, R { D() : B(9) {} };\nstruct D0 : L, R {};"},{"id":"בתוך main","label":"בתוך main","language":"cpp","code":"D object;\nint first = object.value;\nL\u0026 left = object;\nR\u0026 right = object;\nleft.value = 4;\nint second = right.value;\nD0 other;\nint third = other.value;"}],"data_tables":[],"options":[{"id":"A","text":"(9, 4, 0)","code":null,"code_language":null},{"id":"B","text":"(1, 2, 1)","code":null,"code_language":null},{"id":"C","text":"(9, 2, 0)","code":null,"code_language":null},{"id":"D","text":"(2, 4, 2)","code":null,"code_language":null}],"hint":"שאל כמה מופעי B יש בכל אובייקט ומי בונה את האובייקט השלם.","answer":{"correct_option_id":"A","explanation":"בכל אובייקט D קיים תת־אובייקט B משותף אחד, ואתחולו באחריות המחלקה הנגזרת ביותר D: לכן הוא מתחיל ב-9. כתיבה דרך L וקריאה דרך R פונות לאותו value, ולכן second=4. ב-D0 אין אתחול מפורש לבסיס הווירטואלי, ולכן B נבנית באמצעות ברירת המחדל n=0. אתחולי B שכתובים ב-L וב-R אינם קובעים את ערכה כשהן נבנות כחלק מ-D או D0.","reasoning_steps":["D בוחרת את B(9) עבור הבסיס המשותף.","שני מסלולי הירושה מובילים לאותו B בתוך object.","ב-other המחלקה הנגזרת ביותר היא D0, ולכן ברירת המחדל של B קובעת 0."],"option_feedback":{"A":"שלושת הערכים נובעים משיתוף הבסיס ומהאחריות של המחלקה הנגזרת ביותר לאתחולו.","B":"האפשרות מתייחסת למסלולי הירושה כאילו היו בסיסים נפרדים ומתעלמת מאתחול D.","C":"יש רק value משותף אחד, ולכן הקריאה דרך R רואה את השינוי דרך L.","D":"אין כלל שלפיו הבנאי האחרון בשרשרת דורס שוב את הבסיס הווירטואלי."}},"author_validation":{"visibility":"author_only","kind":"cpp17_and_reasoning","python_assertions":null,"cpp_cases":[{"label":"runtime_assertions","stan       at.qids.forEach(function (qid, i) {
        var answered = !!at.answers[qid], flagged = !!at.flags[qid];
        var parts = ['שאלה ' + (i + 1), answered ? 'נענתה' : 'לא נענתה'];
        if (flagged) parts.push('מסומנת לחזרה');
        var mark = null;
        if (at.mode === 'practice' && at.checked[qid]) {
          var right = at.answers[qid] === Z.qmap[qid].answer.correct_option_id;
          parts.push(right ? 'נבדקה: נכונה' : 'נבדקה: שגויה');
          mark = el('span', { class: 'mk', 'aria-hidden': 'true', text: right ? '✓' : '✗' });
        }
        grid.appendChild(el('button', {
          type: 'button',
          class: (answered ? 'answered' : '') + (flagged ? ' flagged' : ''),
          'aria-label': parts.join(', '),
          'aria-current': i === at.current ? 'step' : null,
          onclick: function () { at.current = i; go({ screen: 'quiz', mode: at.mode }); }
        }, String(i + 1), mark));
      });
      nav.replaceChildren(grid, el('div', { class: 'legend-line', text: '● נענתה · ⚑ מסומנת לחזרה' + (at.mode === 'practice' ? ' · ✓/✗ נבדקה' : '') }));
    }
    refreshChrome();

    var locked = isLocked(at, id);
    var article = el('article', { class: 'card', 'aria-labelledby': 'q-h' });
    article.appendChild(el('h2', { id: 'q-h', class: 'qhead' },
      el('span', { class: 'qnum', text: 'שאלה ' + (at.current + 1) + ' מתוך ' + n }),
      el('span', { class: 'qtitle' }, rich(q.title))));
    append(article, questionBody(q));

    var checkBtn = null;
    var fs = el('fieldset', { class: 'options', 'aria-describedby': 'q-text-' + q.id },
      el('legend', { class: 'sr-only', text: 'בחר תשובה אחת' }));
    q.options.forEach(function (o) {
      var input = el('input', {
        type: 'radio', name: 'answer-' + id, value: o.id, id: 'opt-' + id + '-' + o.id,
        checked: at.answers[id] === o.id, disabled: locked,
        onchange: function () {
          if (isLocked(at, id)) return;
          at.answers[id] = o.id;
          save();
          refreshChrome();
          if (checkBtn) checkBtn.disabled = false;
        }
      });
      fs.appendChild(el('label', { class: 'opt' + (locked ? ' locked' : ''), for: input.id },
        input, el('span', { class: 'letter', 'aria-hidden': 'true', text: o.id }),
        el('span', { class: 'sr-only', text: 'אפשרות ' + o.id + ': ' }), optionBody(o)));
    });
    article.appendChild(fs);

    if (at.mode === 'practice') {
      var full = Z.qmap[id];
      var hintBox = el('div', { id: 'hint-box' });
      var tools = el('div', { class: 'tools' });
      if (full.hint && !at.checked[id]) {
        var hintBtn = el('button', { type: 'button', text: 'רמז', 'aria-expanded': 'false', 'aria-controls': 'hint-box', onclick: function () {
          var open = hintBtn.getAttribute('aria-expanded') === 'true';
          hintBox.replaceChildren();
          if (!open) hintBox.appendChild(el('div', { class: 'hint' }, el('strong', { text: 'רמז: ' }), rich(full.hint)));
          hintBtn.setAttribute('aria-expanded', String(!open));
        } });
        tools.appendChild(hintBtn);
      }
      if (!at.checked[id]) {
        checkBtn = el('button', { type: 'button', class: 'primary', text: 'בדוק תשובה', disabled: !at.answers[id], onclick: function () {
          if (!at.answers[id]) return;
          at.checked[id] = true;
          save();
          pendingFocus = '#solution-h';
          render();
        } });
        tools.appendChild(checkBtn);
      }
      article.appendChild(tools);
      article.appendChild(hintBox);
      if (at.checked[id]) {
        markOptions(fs, full, at.answers[id]);
        article.appendChild(solutionPanel(full, at.answers[id], 'solution-h'));
      }
    }

    var prev = el('button', { type: 'button', text: '→ הקודמת', disabled: at.current === 0, onclick: function () { at.current--; go({ screen: 'quiz', mode: at.mode }); } });
    var next = el('button', { type: 'button', text: 'הבאה ←', disabled: at.current === n - 1, onclick: function () { at.current++; go({ screen: 'quiz', mode: at.mode }); } });
    var flag = el('button', { type: 'button', 'aria-pressed': String(!!at.flags[id]), text: at.flags[id] ? '⚑ מסומנת לחזרה' : '⚐ סמן לחזרה', onclick: function () {
      if (at.flags[id]) delete at.flags[id]; else at.flags[id] = true;
      save();
      flag.setAttribute('aria-pressed', String(!!at.flags[id]));
      flag.textContent = at.flags[id] ? '⚑ מסומנת לחזרה' : '⚐ סמן לחזרה';
      refreshChrome();
    } });
    article.appendChild(el('div', { class: 'controls' },
      el('div', { class: 'group' }, prev, next), el('div', { class: 'group' }, flag)));

    app.appendChild(el('section', { class: 'card', style: 'padding:14px 16px', 'aria-label': 'מצב הניסיון' }, status, nav));
    app.appendChild(article);
    app.appendChild(el('div', { class: 'row spread' },
      el('button', { type: 'button', text: 'למסך המבחן', onclick: function () { go({ screen: 'start' }); } }),
      el('button', { type: 'button', class: 'primary', text: at.mode === 'practice' ? 'סיים תרגול' : 'הגש בחינה', onclick: function () { requestSubmit(at); } })));
  }

  function requestSubmit(at) {
    var missing = [];
    at.qids.forEach(function (qid, i) { if (!at.answers[qid]) missing.push(i + 1); });
    var isExam = at.mode === 'exam';
    var body = [];
    if (missing.length) {
      body.push(el('p', { text: 'לא נענו ' + missing.length + ' שאלות מתוך ' + at.qids.length + '.' }));
      body.push(el('p', { class: 'muted', text: 'מספרי השאלות: ' + missing.join(', ') }));
      body.push(el('p', { text: 'שאלה שלא נענתה מקבלת 0 נקודות.' }));
    } else {
      body.push(el('p', { text: 'נענו כל ' + at.qids.length + ' השאלות.' }));
    }
    body.push(el('p', { text: isExam ? 'לאחר ההגשה התשובות יינעלו ותוצג סקירה מלאה.' : 'לאחר הסיום יוצג סיכום התרגול.' }));
    confirmDialog({
      title: isExam ? 'להגיש את הבחינה?' : 'לסיים את התרגול?',
      body: body,
      ok: missing.length ? (isExam ? 'הגש בכל זאת' : 'סיים בכל זאת') : (isExam ? 'הגש' : 'סיים'),
      cancel: 'המשך לענות'
    }).then(function (yes) {
      if (!yes) return;
      at.submitted = true;
      at.submittedAt = new Date().toISOString();
      store.history.unshift(at);
      store.history = store.history.slice(0, HISTORY_LIMIT);
      store.active[at.mode] = null;
      go({ screen: 'results', resultId: at.id, filter: 'all' });
    });
  }

  // ----- Solutions (only after submission or explicit practice check) -----
  function markOptions(fs, q, chosen) {
    var correct = q.answer.correct_option_id;
    fs.querySelectorAll('label.opt').forEach(function (label) {
      var oid = label.querySelector('input').value;
      var body = label.querySelector('.body');
      var tags = el('span', { class: 'tags' });
      if (oid === correct) { label.classList.add('is-correct'); tags.appendChild(el('span', { class: 'tag ok', text: '✓ התשובה הנכונה' })); }
      if (oid === chosen) {
        if (oid !== correct) label.classList.add('is-wrong');
        tags.appendChild(el('span', { class: 'tag ' + (oid === correct ? 'ok' : 'bad'), text: oid === correct ? 'הבחירה שלך' : '✗ הבחירה שלך' }));
      }
      if (tags.childNodes.length) body.appendChild(tags);
    });
  }

  function sourceRefs(q) {
    if (q.source_slides && q.source_slides.length) {
      return el('p', { class: 'muted' }, 'שקפים במצגת לעיון חוזר: ', el('bdi', { dir: 'ltr', text: q.source_slides.join(', ') }));
    }
    var sp = q.source_pages;
    if (sp && sp.pdf && sp.pdf.length) {
      return el('p', { class: 'muted' }, 'עמודים בסיכום לעיון חוזר: PDF ', el('bdi', { dir: 'ltr', text: sp.pdf.join(', ') }),
        sp.printed && sp.printed.length ? [' (מודפס: ', el('bdi', { dir: 'ltr', text: sp.printed.join(', ') }), ')'] : null);
    }
    return null;
  }

  function solutionPanel(q, chosen, headingId) {
    var ans = q.answer;
    var correct = ans.correct_option_id;
    var verdict = !chosen ? el('span', { class: 'verdict none', text: '— לא נענתה' })
      : chosen === correct ? el('span', { class: 'verdict ok', text: '✓ תשובה נכונה' })
      : el('span', { class: 'verdict bad', text: '✗ תשובה שגויה' });
    var panel = el('section', { class: 'solution', 'aria-labelledby': headingId },
      el('h3', { id: headingId, text: 'פתרון' }),
      el('p', null, verdict, ' · הבחירה שלך: ', el('bdi', { text: chosen || 'לא נבחרה' }), ' · התשובה הנכונה: ', el('bdi', { dir: 'ltr', text: correct })),
      el('h4', { text: 'הסבר' }),
      el('p', null, rich(ans.explanation)));
    if (ans.reasoning_steps && ans.reasoning_steps.length) {
      panel.appendChild(el('h4', { text: 'שלבי הפתרון' }));
      panel.appendChild(el('ol', null, ans.reasoning_steps.map(function (s) { return el('li', null, rich(s)); })));
    }
    if (ans.trace_table) {
      var t = ans.trace_table;
      panel.appendChild(el('h4', { text: 'מעקב אחר שלבי הביניים' }));
      panel.appendChild(el('div', { class: 'tablewrap' }, el('table', null,
        el('thead', null, el('tr', null, t.columns.map(function (c) { return el('th', { scope: 'col', text: c }); }))),
        el('tbody', null, t.rows.map(function (r) {
          return el('tr', null, r.map(function (cell, i) {
            return el('td', null, i === 0 ? rich(cell) : (isWholeLtr(cell) ? el('bdi', { dir: 'ltr', class: 'ic', text: cell }) : rich(cell)));
          }));
        })))));
    }
    panel.appendChild(el('h4', { text: 'משוב לכל אפשרות' }));
    panel.appendChild(el('dl', { class: 'feedback' }, q.options.map(function (o) {
      var marks = [];
      if (o.id === correct) marks.push('נכונה');
      if (o.id === chosen) marks.push('הבחירה שלך');
      return [
        el('dt', null, el('bdi', { text: o.id }), marks.length ? ' (' + marks.join(', ') + ')' : ''),
        el('dd', null, rich(ans.option_feedback[o.id] || ''))
      ];
    })));
    panel.appendChild(sourceRefs(q) || document.createTextNode(''));
    return panel;
  }

  // ----- Results & review -----
  function renderResults(r) {
    var s = scoreOf(Z, r);
    var filter = store.view.filter === 'missed' ? 'missed' : 'all';
    var missedIds = r.qids.filter(function (id) { return s.per[id] !== 'c'; });

    app.appendChild(el('section', { class: 'card', 'aria-labelledby': 'res-h' },
      el('h2', { id: 'res-h', text: 'תוצאות — ' + modeName(r.mode) }),
      el('p', { class: 'score' }, String(s.points), el('small', { text: ' מתוך ' + s.max })),
      r.qids.length !== Z.allIds.length ? el('p', { class: 'muted', text: 'ניסיון על תת־קבוצה של ' + s.total + ' שאלות; הציון המרבי הוא ' + s.total + ' × ' + Z.pts + ' = ' + s.max + '.' }) : null,
      el('div', { class: 'stats' },
        el('span', { text: '✓ נכונות: ' + s.correct }),
        el('span', { text: '✗ שגויות: ' + s.wrong }),
        el('span', { text: '— לא נענו: ' + s.unanswered }),
        el('span', { class: 'muted', text: 'הוגש: ' + fmtDate(r.submittedAt) })),
      el('div', { class: 'row', style: 'margin-top:12px' },
        missedIds.length ? el('button', { type: 'button', class: 'primary', text: 'תרגול הטעויות והשאלות שלא נענו (' + missedIds.length + ')', onclick: function () { startAttempt('practice', missedIds); } }) : null,
        missedIds.length ? el('button', { type: 'button', text: 'בחינה חוזרת על הטעויות והשאלות שלא נענו (' + missedIds.length + ')', onclick: function () { startAttempt('exam', missedIds); } }) : null,
        el('button', { type: 'button', text: 'למסך המבחן', onclick: function () { go({ screen: 'start' }); } }))));

    // Topic summary: a question can count toward several topics.
    var topics = {}, order = [];
    r.qids.forEach(function (id) {
      (Z.qmap[id].topics || []).forEach(function (t) {
        if (!topics[t]) { topics[t] = { total: 0, correct: 0 }; order.push(t); }
        topics[t].total++;
        if (s.per[id] === 'c') topics[t].correct++;
      });
    });
    order.sort(function (a, b) {
      var ra = topics[a].correct / topics[a].total, rb = topics[b].correct / topics[b].total;
      return ra - rb || topics[b].total - topics[a].total;
    });
    app.appendChild(el('section', { class: 'card', 'aria-labelledby': 'topics-h' },
      el('h2', { id: 'topics-h', text: 'סיכום לפי נושאים' }),
      el('p', { class: 'muted', text: 'שאלה יכולה להשתייך לכמה נושאים, ולכן סכום השורות גדול ממספר השאלות. הנושאים החלשים מוצגים ראשונים.' }),
      el('div', { class: 'tablewrap' }, el('table', null,
        el('thead', null, el('tr', null, el('th', { scope: 'col', text: 'נושא' }), el('th', { scope: 'col', text: 'נכונות' }), el('th', { scope: 'col', text: 'אחוז' }))),
        el('tbody', null, order.map(function (t) {
          var x = topics[t];
          return el('tr', null,
            el('td', null, rich(TOPIC_NAMES[t] || t)),
            el('td', { class: 'num' }, el('bdi', { dir: 'ltr', text: x.correct + ' / ' + x.total })),
            el('td', { class: 'num' }, el('bdi', { dir: 'ltr', text: Math.round(100 * x.correct / x.total) + '%' })));
        }))))));

    var shown = filter === 'missed' ? missedIds : r.qids;
    var fAll = el('input', { type: 'radio', name: 'rev-filter', value: 'all', checked: filter === 'all', onchange: function () { go({ screen: 'results', resultId: r.id, filter: 'all' }, '#review-h'); } });
    var fMissed = el('input', { type: 'radio', name: 'rev-filter', value: 'missed', checked: filter === 'missed', onchange: function () { go({ screen: 'results', resultId: r.id, filter: 'missed' }, '#review-h'); } });
    var review = el('section', { 'aria-labelledby': 'review-h' },
      el('h2', { id: 'review-h', text: 'סקירת השאלות', style: 'margin-top:24px' }),
      el('fieldset', { class: 'modes' },
        el('legend', { text: 'הצג' }),
        el('label', null, fAll, el('span', { text: 'כל השאלות (' + r.qids.length + ')' })),
        el('label', null, fMissed, el('span', { text: 'רק טעויות ושאלות שלא נענו (' + missedIds.length + ')' }))));
    if (shown.length) {
      review.appendChild(el('nav', { class: 'jump', 'aria-label': 'מעבר לשאלה בסקירה' }, shown.map(function (id) {
        var i = r.qids.indexOf(id);
        var st = s.per[id];
        return el('a', { href: '#rev-' + id, 'aria-label': 'שאלה ' + (i + 1) + ', ' + (st === 'c' ? 'נכונה' : st === 'w' ? 'שגויה' : 'לא נענתה') },
          (st === 'c' ? '✓ ' : st === 'w' ? '✗ ' : '— ') + (i + 1));
      })));
    } else {
      review.appendChild(el('p', { class: 'card', text: 'אין טעויות או שאלות שלא נענו בניסיון זה.' }));
    }
    shown.forEach(function (id) {
      var q = Z.qmap[id];
      var i = r.qids.indexOf(id);
      var chosen = r.answers[id];
      var item = el('article', { class: 'card review-item', id: 'rev-' + id, 'aria-labelledby': 'rev-h-' + id },
        el('h3', { id: 'rev-h-' + id, class: 'qhead' },
          el('span', { class: 'qnum', text: 'שאלה ' + (i + 1) }),
          el('span', { class: 'qtitle' }, rich(q.title))),
        questionBody(publicView(q)));
      var fs = el('fieldset', { class: 'options' }, el('legend', { class: 'sr-only', text: 'האפשרויות' }));
      q.options.forEach(function (o) {
        var input = el('input', { type: 'radio', name: 'rev-' + r.id + '-' + id, value: o.id, id: 'rev-opt-' + id + '-' + o.id, checked: chosen === o.id, disabled: true });
        fs.appendChild(el('label', { class: 'opt locked', for: input.id }, input,
          el('span', { class: 'letter', 'aria-hidden': 'true', text: o.id }),
          el('span', { class: 'sr-only', text: 'אפשרות ' + o.id + ': ' }), optionBody(o)));
      });
      item.appendChild(fs);
      markOptions(fs, q, chosen);
      item.appendChild(solutionPanel(q, chosen, 'sol-h-' + id));
      review.appendChild(item);
    });
    app.appendChild(review);
    app.appendChild(el('div', { class: 'row' }, el('button', { type: 'button', text: 'למסך המבחן', onclick: function () { go({ screen: 'start' }); } })));
  }

  // ---------- Boot ----------
  if (!storage) globalNotices.push('אחסון מקומי אינו זמין בדפדפן זה. האתר עובד כרגיל, אך ההתקדמות לא תישמר לאחר סגירה או רענון.');
  QUIZZES.forEach(function (z) { z.store = loadStore(z); });
  var savedApp = readKey(APP_KEY);
  var initial = savedApp && QUIZ_BY_ID[savedApp.selected] ? savedApp.selected : null;
  if (!initial && !savedApp) {
    // First visit after the multi-quiz update: reopen the quiz that has saved progress.
    QUIZZES.forEach(function (z) { if (!initial && (z.store.active.exam || z.store.active.practice || z.store.history.length)) initial = z.id; });
  }
  selectQuiz(initial);
  render();
})();
</script>
</body>
</html>
